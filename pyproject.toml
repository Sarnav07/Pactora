[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pactora"
version = "0.1.0"
description = "Private-selection shopping MCP with a mandatory spending boundary"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx[socks]>=0.28,<1",
  "cryptography>=44", "mcp>=1.12,<2", "pydantic>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11"]

[project.scripts]
pactora-test-merchant = "pactora.merchant_cli:main"
pactora = "pactora.cli:main"
pactora-wallet-approve = "pactora.wallet_approval:main"
pactora-wallet = "pactora.wallet_cli:main"
pactora-mcp = "pactora.mcp_server:main"

# Legacy operator entry points remain compatible.
veilcart = "pactora.cli:main"
veilcart-mcp = "pactora.mcp_server:main"
veilcart-wallet = "pactora.wallet_cli:main"
veilcart-wallet-approve = "pactora.wallet_approval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pactora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
